        <li>

        <li>
            <a href="rfid_scan.html">
                <i class="fa-solid fa-wifi"></i>

        <li>
            <a href="transactions.html">

            <a href="settings.html">
                <i class="fa-solid fa-gear"></i>
                Settings
            </a>
        </li>

    </ul>
    <!-- Welcome Card -->

    <div class="bottom-card">

        <img src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png">

        <h3>Welcome Admin</h3>

        <p>
            Manage your library resources efficiently.
        </p>

        <button class="scan-btn">
            <i class="fa-solid fa-wifi"></i>
            Scan RFID
        </button>


    </div>
    <!-- Logout -->

    <div class="logout-btn"  id="logoutBtn">

        <a href="logout.html">
            <i class="fa-solid fa-right-from-bracket"></i>
            Logout
        </a>

    </div>

</div>

</div>

<div class="main-content">

    <div class="top-navbar">

        <div class="search-bar">

            <i class="fa-solid fa-magnifying-glass"></i>

            <input type="text" placeholder="Search here...">

        </div>

    </div>

    <div class="dashboard-header">

        <div>

            <h1>Settings</h1>
            <p>System settings and preferences</p>

        </div>

    </div>

    <!-- SETTINGS -->

    <div class="settings-container">

        <!-- LEFT -->

        <div class="settings-menu">

            <button class="active-setting">General</button>

            <button>Library Info</button>

            <button>Email Settings</button>

            <button>Backup</button>

            <button>Security</button>

        </div>

        <!-- RIGHT -->

        <div class="settings-form">

            <label>Library Name</label>

            <input type="text" value="Smart Library">

            <label>Library Address</label>

            <input type="text" value="123 Library Street, Yangon">

            <div class="double-input">

                <div>

                    <label>Phone</label>

                    <input type="text" value="09-123456789">

                </div>

                <div>

                    <label>Email</label>

                    <input type="email" value="library@example.com">

                </div>

            </div>

            <label>Timezone</label>

            <select>
                <option>Asia/Yangon</option>
            </select>

            <button class="save-btn">
                Save Changes
            </button>

        </div>

    </div>

</div>

</body>
</html>
